services:
  backend:
    container_name: bon-path-backend
    build: ./bon-path-backend
    volumes:
      - ./bon-path-backend:/backend
      - ./share:/share
    ports:
      - "8080:8080"
    command: sh -c "npm run migrate:dev && npm run migrate:test && npm run dev"
    depends_on:
      - database
      - storage
  database:
    container_name: bon-path-database
    image: postgres:13
    environment:
      POSTGRES_USER: bonpath
      POSTGRES_PASSWORD: bonpath
      POSTGRES_DB: bonpath
    ports:
      - "5432:5432"
    volumes:
      - ./.psql-data:/var/lib/postgresql/data
  storage:
    container_name: bon-path-storage
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bonpath-minio
      MINIO_ROOT_PASSWORD: bonpath-minio
    volumes:
      - ./.minio-data:/data